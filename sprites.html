<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Витрина спрайтов</title>
  <!-- Просим браузер не хранить саму страницу в кэше, а каждый раз спрашивать свежую -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- Номер версии. Сам version.js грузим с текущим временем в адресе — он всегда свежий -->
  <script>document.write('<script src="version.js?t=' + Date.now() + '"><\/script>');</script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #1a1c2c;
      color: #f4f4f4;
      font-family: sans-serif;
    }
    h1 { font-size: 22px; }
    h2 { font-size: 18px; color: #ffcd75; }
    /* Ряд карточек с анимациями, переносится на новую строку */
    .row { display: flex; flex-wrap: wrap; gap: 16px; }
    .card { text-align: center; }
    /* Спрайты рисуем на холсте увеличенными, пиксели чёткие */
    canvas {
      background: #41a6f6;   /* цвет неба, как в игре */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .label { margin-top: 6px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Витрина спрайтов</h1>
  <div id="list"></div>

  <!-- Файлы с меткой версии (sprites.js?v=0.6) -->
  <script>loadWithVersion(['font.js', 'sprites.js']);</script>
  <script>
    // Во сколько раз увеличиваем спрайты
    const ZOOM = 6;
    const list = document.getElementById('list');
    const players = []; // все анимации на странице

    // Для каждого персонажа — заголовок и карточки с анимациями
    for (const key in SPRITES) {
      const ch = SPRITES[key];
      const title = document.createElement('h2');
      title.textContent = ch.name + ' (' + ch.w + 'x' + ch.h + ')';
      list.appendChild(title);

      const row = document.createElement('div');
      row.className = 'row';
      list.appendChild(row);

      for (const animKey in ch.anims) {
        const anim = ch.anims[animKey];
        const card = document.createElement('div');
        card.className = 'card';

        // Холст в настоящем размере спрайта, а CSS увеличивает его в ZOOM раз
        const cv = document.createElement('canvas');
        cv.width = ch.w;
        cv.height = ch.h;
        cv.style.width = ch.w * ZOOM + 'px';
        cv.style.height = ch.h * ZOOM + 'px';

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = anim.name + ' — кадров: ' + anim.frames.length;

        card.appendChild(cv);
        card.appendChild(label);
        row.appendChild(card);
        players.push({ ctx: cv.getContext('2d'), anim: anim, w: ch.w, h: ch.h });
      }
    }

    // Портреты для диалогов — картинки без анимации, на фоне как в окне диалога
    const ptitle = document.createElement('h2');
    ptitle.textContent = 'Портреты (32x32)';
    list.appendChild(ptitle);
    const prow = document.createElement('div');
    prow.className = 'row';
    list.appendChild(prow);
    for (const key in PORTRAITS) {
      const pr = PORTRAITS[key];
      const card = document.createElement('div');
      card.className = 'card';
      const cv = document.createElement('canvas');
      cv.width = 32;
      cv.height = 32;
      cv.style.width = 32 * ZOOM + 'px';
      cv.style.height = 32 * ZOOM + 'px';
      cv.style.background = '#333c57';
      cv.getContext('2d').drawImage(pr.image, 0, 0);
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = pr.name;
      card.appendChild(cv);
      card.appendChild(label);
      prow.appendChild(card);
    }

    // Иконки 8x8 для шкалы гонки
    addStaticSection('Иконки для шкалы (8x8)', ICONS, 8, 8, ZOOM, (g, item) => g.drawImage(item.image, 0, 0));

    // Мебель и крупные вещи уровня (в плитках по 8 пикселей). Над предметом — немного места
    // (на столе стоит чашка, над калиткой табличка).
    const furnItems = {};
    for (const key in FURNITURE) furnItems[key] = { name: FURNITURE[key].name + ' (' + key + ', ' + FURNITURE[key].w + 'x' + FURNITURE[key].h + ')', w: FURNITURE[key].w * 8, h: FURNITURE[key].h * 8, paint: (g) => drawFurniture(g, FURNITURE[key], 2, 18, 30) };
    furnItems.C = { name: 'Телефон-звонок (C)', w: 16, h: 16, paint: (g) => drawPhonePickup(g, 6, 16, 0) };
    furnItems.E = { name: 'Калитка «ВЫХОД» (E, 4x4)', w: 32, h: 32, paint: (g) => drawGate(g, 2, 18) };
    furnItems.N1 = { name: 'Выход из части: наверх (N, 3x4)', w: 24, h: 32, paint: (g) => drawPartExit(g, 2, 18, 'stairs', 0) };
    furnItems.N2 = { name: 'Выход из части: окно (N на фоне windowEnd)', w: 24, h: 32, paint: (g) => drawPartExit(g, 2, 18, 'window', 0) };
    furnItems.L = { name: 'Лера с досками (L, 2x3) — картинка', w: 76, h: 24, paint: (g) => drawLeraWithBoards(g, 30, 18, 0, true) };
    furnItems.N3 = { name: 'Уровень 2: дверь подъезда (N на фонах stairs5, podyezdDoor)', w: 28, h: 32, paint: (g) => drawPartExit(g, 2, 18, 'door', 0) };
    furnItems.N4 = { name: 'Уровень 2: выход к парковке (N на фоне playground)', w: 24, h: 32, paint: (g) => drawPartExit(g, 2, 18, 'arrow', 0) };
    furnItems.E2 = { name: 'Уровень 2: арка выхода со двора (E на фоне archYard)', w: 84, h: 118, paint: (g) => drawArch(g, 28, 102) };
    const furnRow = addRow('Предметы на уровне (тёмный контур — твёрдые части, где можно стоять)');
    for (const key in furnItems) {
      const it = furnItems[key];
      addCard(furnRow, it.w + 4, it.h + 18, 6, it.name, (g) => it.paint(g));
    }

    // Ловушки, пылесос и пиво
    const trapRow = addRow('Ловушки, пылесос и пиво');
    addCard(trapRow, 12, 12, 6, 'Лего (l)', (g) => drawLego(g, 2, 2));
    addCard(trapRow, 30, 28, 6, 'Грабли (i): лежат и бьют', (g) => { g.fillStyle = '#38b764'; g.fillRect(0, 26, 30, 2); drawRake(g, 2, 18, 0); drawRake(g, 14, 18, 1); });
    addCard(trapRow, 20, 12, 6, 'Пылесос (w)', (g) => drawVacuum(g, 2, 2, 0));
    addCard(trapRow, 12, 12, 6, 'Пиво (b)', (g) => { g.fillStyle = '#1a1c2c'; g.fillRect(0, 0, 12, 12); drawBeer(g, 2, 2, false); });
    addCard(trapRow, 12, 12, 6, 'Пустая кружка в HUD', (g) => { g.fillStyle = '#1a1c2c'; g.fillRect(0, 0, 12, 12); drawBeer(g, 2, 2, true); });
    addCard(trapRow, 24, 14, 6, 'Звёздочки (оглушён)', (g) => drawStars(g, 12, 7, 0));

    // Бустеры и эффекты
    const boostRow = addRow('Бустеры и эффекты');
    addCard(boostRow, 12, 12, 6, 'Сигареты (x): +40% куража', (g) => drawCigs(g, 2, 2));
    addCard(boostRow, 12, 12, 6, 'Кофе (u): быстрее и неуязвим', (g) => drawCoffee(g, 2, 2, 0));
    addCard(boostRow, 24, 16, 6, 'Дымок после сигарет', (g) => { g.fillStyle = '#333c57'; g.fillRect(0, 0, 24, 16); drawSmokePuff(g, 5, 10, 0.1); drawSmokePuff(g, 12, 8, 0.4); drawSmokePuff(g, 19, 5, 0.8); });
    addCard(boostRow, 24, 34, 6, 'Кофе: свечение и пар', (g) => {
      const f = SPRITES.filipp.anims.idle.frames[0];
      const glow = makeSilhouette(f, '#ffcd75');
      for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) g.drawImage(glow, 4 + ox, 9 + oy);
      g.drawImage(f, 4, 9);
      drawSteam(g, 12, 8, 10);
    });
    addCard(boostRow, 30, 18, 6, 'Лежит на диване: «ХР-Р-Р...»', (g) => {
      g.save(); g.translate(15, 9); g.rotate(-Math.PI / 2); g.drawImage(SPRITES.filipp.anims.idle.frames[0], -8, -12); g.restore();
    });

    // Уровень 2: оружие и особые вещи
    const l2Row = addRow('Уровень 2: оружие, ящик с ключами, поливалка, лавка с бабушками');
    addCard(l2Row, 12, 12, 6, 'Гаечный ключ (значок в HUD)', (g) => { g.fillStyle = '#1a1c2c'; g.fillRect(0, 0, 12, 12); g.drawImage(ICON_WRENCH, 2, 2); });
    addCard(l2Row, 44, 12, 6, 'Ключ летит и крутится', (g) => { for (let i = 0; i < 4; i++) drawWrench(g, 6 + i * 11, 6, i * Math.PI / 2); });
    addCard(l2Row, 12, 12, 6, 'Контейнер плова', (g) => { g.fillStyle = '#1a1c2c'; g.fillRect(0, 0, 12, 12); g.drawImage(ICON_PLOV, 2, 2); });
    addCard(l2Row, 28, 10, 6, 'Плов на земле (3 плитки, 8 с)', (g) => { g.fillStyle = '#566c86'; g.fillRect(0, 8, 28, 2); drawPlovStrip(g, 2, 5, 24, 1); });
    addCard(l2Row, 12, 12, 6, 'Ящик с ключами (y): +3', (g) => drawKeyBox(g, 2, 3));
    addCard(l2Row, 64, 34, 6, 'Поливалка (w) и струя', (g) => {
      g.fillStyle = '#73eff7'; g.fillRect(0, 0, 64, 34);
      g.fillStyle = '#38b764'; g.fillRect(0, 32, 64, 2);
      drawSprinkler(g, 52, 24, 0);
      for (let i = 1; i <= 10; i++) { const t = i / 10; drawWaterDrop(g, Math.round(56 - 48 * t), Math.round(26 + 6 * t - 96 * t * (1 - t)), i % 2); }
    });
    addCard(l2Row, 60, 34, 6, 'Лавка с бабушками (g, h)', (g) => {
      g.fillStyle = '#73eff7'; g.fillRect(0, 0, 60, 34);
      drawGossipBench(g, 10, 18, 40);
      ['grannyRed', 'grannyGreen', 'grannyBlue'].forEach((k, i) => g.drawImage(SPRITES[k].anims.talk.frames[0], 12 + i * 13, 10));
    });
    addCard(l2Row, 16, 16, 6, 'Стрелка: едет велик', (g) => { g.fillStyle = '#73eff7'; g.fillRect(0, 0, 16, 16); drawWarnArrow(g, 8, 8, -1, 0); });

    // Босс уровня 2: мама — сердечки и просьбы
    const momRow = addRow('Босс уровня 2 (мама): сердечки и просьбы');
    addCard(momRow, 11, 11, 6, 'Сердечко: поймай', (g) => drawLoveHeart(g, 2, 2, false));
    addCard(momRow, 18, 16, 6, 'Большое сердце «ФОТО ИЗ ДЕТСТВА»', (g) => drawLoveHeart(g, 2, 2, true));
    for (const [kind, label] of [['tap', 'кран'], ['toilet', 'унитаз'], ['bulb', 'лампочка'], ['tile', 'плитка']]) {
      addCard(momRow, 18, 15, 6, 'Просьба: ' + label, (g) => { g.fillStyle = '#73eff7'; g.fillRect(0, 0, 18, 15); drawRequest(g, 2, 2, kind); });
    }

    // Уровень 3: офис
    const officeRow = addRow('Уровень 3: офис и склад');
    const bgc = (g, w, h) => { g.fillStyle = '#566c86'; g.fillRect(0, 0, w, h); };
    addCard(officeRow, 16, 18, 6, 'Офисное кресло (h): толкается, на нём можно прокатиться', (g) => { bgc(g, 16, 18); drawOfficeChair(g, 2, 2); });
    addCard(officeRow, 14, 8, 6, 'Пачка листов из ксерокса', (g) => { bgc(g, 14, 8); drawPaperPack(g, 2, 2, 0); });
    addCard(officeRow, 14, 14, 6, 'Катящаяся труба (p)', (g) => { bgc(g, 14, 14); drawPipe(g, 2, 2, 0); });
    addCard(officeRow, 44, 28, 6, 'Погрузчик (f): вправо и влево', (g) => { bgc(g, 44, 28); drawForklift(g, 0, 3, 1, 0); drawForklift(g, 16, 3, -1, 0); });
    addCard(officeRow, 30, 18, 6, 'Рабочий телефон клиента (оранжевый) и телефон Леры', (g) => { g.fillStyle = '#566c86'; g.fillRect(0, 0, 30, 18); drawWorkPhone(g, 2, 6, 0); drawPhonePickup(g, 18, 4, 0); });
    addCard(officeRow, 40, 46, 6, 'Турникет — выход (E на фоне reception)', (g) => { bgc(g, 40, 46); drawTurnstile(g, 4, 12); });
    [0, 0.5, 1].forEach((p) => addCard(officeRow, 52, 48, 6, 'Окно: закат ' + (p === 0 ? 'в 19:00' : p === 0.5 ? 'в 19:15' : 'в 19:30'), (g) => { OFFICE_SUNSET = p; bgc(g, 52, 48); drawSunsetWindow(g, 4, 4, 44, 40); OFFICE_SUNSET = 0; }));

    // Уровень 4: ночь
    const nightRow = addRow('Уровень 4: ночь, пешком к Сане');
    const nbg = (g, w, h) => { g.fillStyle = '#29366f'; g.fillRect(0, 0, w, h); };
    addCard(nightRow, 12, 7, 6, 'Шприц (летит по дуге)', (g) => { nbg(g, 12, 7); drawSyringe(g, 2, 2); });
    addCard(nightRow, 20, 50, 6, 'Пар из теплотрассы', (g) => { nbg(g, 20, 50); drawSteamJet(g, 10, 46, 0, 40); });
    addCard(nightRow, 52, 48, 6, 'Переход через дорогу (E на фоне roadSide)', (g) => { nbg(g, 52, 48); drawRoadCrossing(g, 6, 12, 0); });
    addCard(nightRow, 40, 22, 6, 'Собака в темноте: силуэт с горящими глазами', (g) => {
      nbg(g, 40, 22);
      const f = SPRITES.strayDog.anims.stand.frames[0];
      g.drawImage(f, 2, 10); g.drawImage(makeSilhouette(f, '#1a1c2c'), 22, 10);
      g.fillStyle = '#b13e53'; g.fillRect(34, 13, 1, 1); g.fillRect(36, 13, 1, 1);
    });

    // Босс уровня 3: начальник
    const chiefRow = addRow('Босс уровня 3 (начальник): что летит');
    addCard(chiefRow, 14, 10, 6, 'Самолётик «СРОЧНО!»', (g) => { bgc(g, 14, 10); drawPlane(g, 2, 2, -1); });
    addCard(chiefRow, 12, 13, 6, 'Красный лист «ПРАВКИ»', (g) => { bgc(g, 12, 13); drawRedSheet(g, 2, 2); });
    addCard(chiefRow, 12, 10, 6, 'Степлер', (g) => { bgc(g, 12, 10); drawStapler(g, 2, 2, 'stapler', 0); });
    addCard(chiefRow, 12, 10, 6, 'Дырокол', (g) => { bgc(g, 12, 10); drawStapler(g, 2, 2, 'punch', 0); });
    addCard(chiefRow, 14, 11, 6, 'Готовый отчёт (несёт над головой)', (g) => { bgc(g, 14, 11); drawReport(g, 2, 2); });

    // Этап «За рулём»: вид сверху
    const driveRow = addRow('Этап «За рулём»: машины сверху (нос вверх), дорога, обочины');
    const road = (g, w, h) => { g.fillStyle = '#566c86'; g.fillRect(0, 0, w, h); };
    addCard(driveRow, 20, 34, 6, 'Минивэн Филиппа', (g) => { road(g, 20, 34); drawCarTop(g, 'van', 2, 2); });
    SEDAN_COLORS.forEach((c, i) => addCard(driveRow, 18, 28, 6, 'Легковушка ' + (i + 1), (g) => { road(g, 18, 28); drawCarTop(g, 'sedan', 2, 2, c[0], c[1]); }));
    addCard(driveRow, 18, 26, 6, '«Жигули»', (g) => { road(g, 18, 26); drawCarTop(g, 'zhiguli', 2, 2); });
    addCard(driveRow, 24, 54, 6, 'Автобус', (g) => { road(g, 24, 54); drawCarTop(g, 'bus', 2, 2); });
    addCard(driveRow, 24, 50, 6, 'Грузовик', (g) => { road(g, 24, 50); drawCarTop(g, 'truck', 2, 2); });
    addCard(driveRow, 16, 12, 6, 'Яма', (g) => { road(g, 16, 12); drawPothole(g, 2, 2); });
    addCard(driveRow, 20, 12, 6, 'Лужа', (g) => { road(g, 20, 12); drawRoadPuddle(g, 2, 2); });
    addCard(driveRow, 40, 24, 6, 'Светофор: красный, жёлтый, зелёный', (g) => { ['red', 'yellow', 'green'].forEach((c, i) => drawTrafficLight(g, 2 + i * 13, 2, c)); });
    addCard(driveRow, 60, 44, 6, 'Рекламный щит', (g) => { g.fillStyle = '#38b764'; g.fillRect(0, 0, 60, 44); drawBillboard(g, 4, 4, 'МЕТАЛЛО-\nПРОКАТ —\nЗВОНИТЕ!'); });
    addCard(driveRow, 70, 34, 6, 'Деревья и дом сверху', (g) => { g.fillStyle = '#38b764'; g.fillRect(0, 0, 70, 34); drawTreeTop(g, 12, 14, 9); drawTreeTop(g, 30, 18, 6); drawHouseTop(g, 40, 6, 26, 22, '#b13e53'); });
    addCard(driveRow, 240, 110, 3, 'Финиш: офис «МЕТАЛЛ-ТОРГ» и парковка', (g) => drawOffice(g, 62));
    addCard(driveRow, 240, 136, 3, 'Картинка «ВЖУХ!» (колесо за 30 секунд)', (g) => PICTURES.wheelFix(g, 1, 0));

    // Этап «Переход дороги»: вид сверху, машины едут вбок
    const crossRow = addRow('Этап «Переход дороги»: машины боком со светом фар, калитка Сани');
    const asph = (g, w, h) => { g.fillStyle = '#333c57'; g.fillRect(0, 0, w, h); };
    addCard(crossRow, 50, 18, 6, 'Легковушка едет вправо, свет фар', (g) => { asph(g, 50, 18); drawHeadlights(g, 28, 9, 1, 16); drawCarSide(g, 'sedan', 2, 2, 1, SEDAN_COLORS[0][0], SEDAN_COLORS[0][1]); });
    addCard(crossRow, 50, 18, 6, '«Жигули» едут влево', (g) => { asph(g, 50, 18); drawHeadlights(g, 20, 9, -1, 16); drawCarSide(g, 'zhiguli', 20, 2, -1); });
    addCard(crossRow, 52, 20, 6, 'Минивэн Леры (ищет Филиппа)', (g) => { asph(g, 52, 20); drawCarSide(g, 'van', 2, 2, 1); });
    addCard(crossRow, 70, 24, 6, 'Грузовик и автобус', (g) => { asph(g, 70, 24); drawCarSide(g, 'truck', 2, 2, 1); });
    addCard(crossRow, 110, 40, 4, 'Калитка Сани: свет, мангал, дымок', (g) => { g.fillStyle = '#29366f'; g.fillRect(0, 0, 110, 40); drawSanyaGateTop(g, 44, 28, 0); });

    // Бой с близнецами: игрушки, тень падения, сердечки
    const bossRow = addRow('Босс: игрушки, тень, сердечки');
    addCard(bossRow, 12, 12, 6, 'Мяч', (g) => drawToy(g, 'ball', 2, 2));
    addCard(bossRow, 12, 12, 6, 'Кубик', (g) => drawToy(g, 'cube', 2, 2));
    addCard(bossRow, 12, 12, 6, 'Мишка', (g) => drawToy(g, 'bear', 2, 2));
    addCard(bossRow, 24, 8, 6, 'Тень: куда упадёт', (g) => drawToyShadow(g, 12, 5, 0.8));
    addCard(bossRow, 24, 9, 6, 'Сердечки: целое и погасшее', (g) => { g.fillStyle = '#1a1c2c'; g.fillRect(0, 0, 24, 9); drawHeart(g, 4, 2, true); drawHeart(g, 14, 2, false); });

    // Минивэн крупно, рядом Филипп — сравнить рост. Внизу полоска земли.
    const vanRow = addRow('Минивэн (minivan, 10x4) и Филипп для сравнения роста');
    addCard(vanRow, 110, 40, 6, 'Минивэн на домкрате и Филипп', (g) => {
      g.fillStyle = '#41a6f6';
      g.fillRect(0, 0, 110, 40);                         // небо
      g.fillStyle = '#38b764';
      g.fillRect(0, 36, 110, 4);                         // трава
      drawFurniture(g, FURNITURE.minivan, 26, 4);              // минивэн стоит на земле (низ на y = 36)
      g.drawImage(SPRITES.filipp.anims.idle.frames[0], 4, 12);   // Филипп 16x24, ноги на земле
    });

    // Фоны экранов уровня: обои, мелкие вещи и как выглядят плитки # и - на этом фоне
    const lvlRow = addRow('Фоны экранов уровня (240x120, увеличены в 3 раза)');
    for (const key in LEVEL_BACKGROUNDS) {
      const bg = LEVEL_BACKGROUNDS[key];
      addCard(lvlRow, 240, 120, 3, bg.name + ' (' + key + ')', (g) => {
        bg.draw(g, 0, 0);
        for (let c = 0; c < 30; c++) drawSolidTile(g, c * 8, 112, bg.tile, true, 14);
        for (let c = 2; c < 6; c++) drawShelfTile(g, c * 8, 80, bg.shelf || ['#ef7d57', '#b13e53'], c === 2, c === 5, bg.shelfLook);
      });
    }

    // Новый заголовок раздела и ряд для карточек
    function addRow(titleText) {
      const t = document.createElement('h2');
      t.textContent = titleText;
      list.appendChild(t);
      const row = document.createElement('div');
      row.className = 'row';
      list.appendChild(row);
      return row;
    }

    // Карточка: холст w x h, увеличенный в zoom раз, и подпись
    function addCard(row, w, h, zoom, labelText, paint) {
      const card = document.createElement('div');
      card.className = 'card';
      const cv = document.createElement('canvas');
      cv.width = w;
      cv.height = h;
      cv.style.width = w * zoom + 'px';
      cv.style.height = h * zoom + 'px';
      cv.style.background = '#94b0c2';
      paint(cv.getContext('2d'));
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = labelText;
      card.appendChild(cv);
      card.appendChild(label);
      row.appendChild(card);
    }

    // Фоны 240x136 — они большие, поэтому увеличиваем не в 6, а в 3 раза
    const BG_NAMES = { livingRoom: 'Гостиная утром', extension: 'Двор с пристройкой',
                       grannyRoom: 'Квартира бабушки: ковёр, ламповый телевизор показывает',
                       jackYard: 'Двор Филиппа: минивэн на домкрате',
                       openSpace: 'Офис: open space, вывеска «МЕТАЛЛ-ТОРГ»',
                       homeNight: 'Дом вечером: минивэн у дома, в окне Леры свет' };
    const bgItems = {};
    for (const key in BACKGROUNDS) bgItems[key] = { name: BG_NAMES[key] || key, key: key };
    addStaticSection('Фоны заставок (240x136, увеличены в 3 раза)', bgItems, 240, 136, 3,
      (g, item) => BACKGROUNDS[item.key](g));

    // Раздел с картинками без анимации: заголовок и карточки с подписями
    function addStaticSection(titleText, items, w, h, zoom, paint) {
      const t = document.createElement('h2');
      t.textContent = titleText;
      list.appendChild(t);
      const row = document.createElement('div');
      row.className = 'row';
      list.appendChild(row);
      for (const key in items) {
        const card = document.createElement('div');
        card.className = 'card';
        const cv = document.createElement('canvas');
        cv.width = w;
        cv.height = h;
        cv.style.width = w * zoom + 'px';
        cv.style.height = h * zoom + 'px';
        cv.style.background = '#333c57';
        paint(cv.getContext('2d'), items[key]);
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = items[key].name;
        card.appendChild(cv);
        card.appendChild(label);
        row.appendChild(card);
      }
    }

    // Проигрываем все анимации по кругу, 60 шагов в секунду
    let tick = 0;
    let last = performance.now();
    function loop(now) {
      while (now - last >= 1000 / 60) {
        tick++;
        last += 1000 / 60;
      }
      for (const p of players) {
        const i = Math.floor(tick / p.anim.speed) % p.anim.frames.length;
        p.ctx.clearRect(0, 0, p.w, p.h);
        p.ctx.drawImage(p.anim.frames[i], 0, 0);
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
