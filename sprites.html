<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Витрина спрайтов</title>
  <!-- Просим браузер не хранить саму страницу в кэше, а каждый раз спрашивать свежую -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- Номер версии. Сам version.js грузим с текущим временем в адресе — он всегда свежий -->
  <script>document.write('<script src="version.js?t=' + Date.now() + '"><\/script>');</script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #1a1c2c;
      color: #f4f4f4;
      font-family: sans-serif;
    }
    h1 { font-size: 22px; }
    h2 { font-size: 18px; color: #ffcd75; }
    /* Ряд карточек с анимациями, переносится на новую строку */
    .row { display: flex; flex-wrap: wrap; gap: 16px; }
    .card { text-align: center; }
    /* Спрайты рисуем на холсте увеличенными, пиксели чёткие */
    canvas {
      background: #41a6f6;   /* цвет неба, как в игре */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .label { margin-top: 6px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Витрина спрайтов</h1>
  <div id="list"></div>

  <!-- Файлы с меткой версии (sprites.js?v=0.6) -->
  <script>loadWithVersion(['font.js', 'sprites.js']);</script>
  <script>
    // Во сколько раз увеличиваем спрайты
    const ZOOM = 6;
    const list = document.getElementById('list');
    const players = []; // все анимации на странице

    // Для каждого персонажа — заголовок и карточки с анимациями
    for (const key in SPRITES) {
      const ch = SPRITES[key];
      const title = document.createElement('h2');
      title.textContent = ch.name + ' (' + ch.w + 'x' + ch.h + ')';
      list.appendChild(title);

      const row = document.createElement('div');
      row.className = 'row';
      list.appendChild(row);

      for (const animKey in ch.anims) {
        const anim = ch.anims[animKey];
        const card = document.createElement('div');
        card.className = 'card';

        // Холст в настоящем размере спрайта, а CSS увеличивает его в ZOOM раз
        const cv = document.createElement('canvas');
        cv.width = ch.w;
        cv.height = ch.h;
        cv.style.width = ch.w * ZOOM + 'px';
        cv.style.height = ch.h * ZOOM + 'px';

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = anim.name + ' — кадров: ' + anim.frames.length;

        card.appendChild(cv);
        card.appendChild(label);
        row.appendChild(card);
        players.push({ ctx: cv.getContext('2d'), anim: anim, w: ch.w, h: ch.h });
      }
    }

    // Портреты для диалогов — картинки без анимации, на фоне как в окне диалога
    const ptitle = document.createElement('h2');
    ptitle.textContent = 'Портреты (32x32)';
    list.appendChild(ptitle);
    const prow = document.createElement('div');
    prow.className = 'row';
    list.appendChild(prow);
    for (const key in PORTRAITS) {
      const pr = PORTRAITS[key];
      const card = document.createElement('div');
      card.className = 'card';
      const cv = document.createElement('canvas');
      cv.width = 32;
      cv.height = 32;
      cv.style.width = 32 * ZOOM + 'px';
      cv.style.height = 32 * ZOOM + 'px';
      cv.style.background = '#333c57';
      cv.getContext('2d').drawImage(pr.image, 0, 0);
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = pr.name;
      card.appendChild(cv);
      card.appendChild(label);
      prow.appendChild(card);
    }

    // Иконки 8x8 для шкалы гонки
    addStaticSection('Иконки для шкалы (8x8)', ICONS, 8, 8, ZOOM, (g, item) => g.drawImage(item.image, 0, 0));

    // Мебель и крупные вещи уровня (в плитках по 8 пикселей). Над предметом — немного места
    // (на столе стоит чашка, над калиткой табличка).
    const furnItems = {};
    for (const key in FURNITURE) furnItems[key] = { name: FURNITURE[key].name + ' (' + key + ', ' + FURNITURE[key].w + 'x' + FURNITURE[key].h + ')', w: FURNITURE[key].w * 8, h: FURNITURE[key].h * 8, paint: (g) => drawFurniture(g, FURNITURE[key], 2, 18, 30) };
    furnItems.C = { name: 'Телефон-звонок (C)', w: 16, h: 16, paint: (g) => drawPhonePickup(g, 6, 16, 0) };
    furnItems.E = { name: 'Калитка «ВЫХОД» (E, 4x4)', w: 32, h: 32, paint: (g) => drawGate(g, 2, 18) };
    furnItems.N1 = { name: 'Выход из части: наверх (N, 3x4)', w: 24, h: 32, paint: (g) => drawPartExit(g, 2, 18, 'stairs', 0) };
    furnItems.N2 = { name: 'Выход из части: окно (N на фоне windowEnd)', w: 24, h: 32, paint: (g) => drawPartExit(g, 2, 18, 'window', 0) };
    furnItems.L = { name: 'Лера с досками (L, 2x3) — картинка', w: 76, h: 24, paint: (g) => drawLeraWithBoards(g, 30, 18, 0, true) };
    const furnRow = addRow('Предметы на уровне (все твёрдые, тёмный контур — где можно стоять)');
    for (const key in furnItems) {
      const it = furnItems[key];
      addCard(furnRow, it.w + 4, it.h + 18, 6, it.name, (g) => it.paint(g));
    }

    // Минивэн крупно, рядом Филипп — сравнить рост. Внизу полоска земли.
    const vanRow = addRow('Минивэн (A, 10x4) и Филипп для сравнения роста');
    addCard(vanRow, 110, 40, 6, 'Минивэн на домкрате и Филипп', (g) => {
      g.fillStyle = '#41a6f6';
      g.fillRect(0, 0, 110, 40);                         // небо
      g.fillStyle = '#38b764';
      g.fillRect(0, 36, 110, 4);                         // трава
      drawFurniture(g, FURNITURE.A, 26, 4);              // минивэн стоит на земле (низ на y = 36)
      g.drawImage(SPRITES.filipp.anims.idle.frames[0], 4, 12);   // Филипп 16x24, ноги на земле
    });

    // Фоны экранов уровня: обои, мелкие вещи и как выглядят плитки # и - на этом фоне
    const lvlRow = addRow('Фоны экранов уровня (240x120, увеличены в 3 раза)');
    for (const key in LEVEL_BACKGROUNDS) {
      const bg = LEVEL_BACKGROUNDS[key];
      addCard(lvlRow, 240, 120, 3, bg.name + ' (' + key + ')', (g) => {
        bg.draw(g, 0, 0);
        for (let c = 0; c < 30; c++) drawSolidTile(g, c * 8, 112, bg.tile, true, 14);
        for (let c = 2; c < 6; c++) drawShelfTile(g, c * 8, 80, bg.shelf || ['#ef7d57', '#b13e53'], c === 2, c === 5, bg.shelfLook);
      });
    }

    // Новый заголовок раздела и ряд для карточек
    function addRow(titleText) {
      const t = document.createElement('h2');
      t.textContent = titleText;
      list.appendChild(t);
      const row = document.createElement('div');
      row.className = 'row';
      list.appendChild(row);
      return row;
    }

    // Карточка: холст w x h, увеличенный в zoom раз, и подпись
    function addCard(row, w, h, zoom, labelText, paint) {
      const card = document.createElement('div');
      card.className = 'card';
      const cv = document.createElement('canvas');
      cv.width = w;
      cv.height = h;
      cv.style.width = w * zoom + 'px';
      cv.style.height = h * zoom + 'px';
      cv.style.background = '#94b0c2';
      paint(cv.getContext('2d'));
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = labelText;
      card.appendChild(cv);
      card.appendChild(label);
      row.appendChild(card);
    }

    // Фоны 240x136 — они большие, поэтому увеличиваем не в 6, а в 3 раза
    const BG_NAMES = { livingRoom: 'Гостиная утром', extension: 'Двор с пристройкой' };
    const bgItems = {};
    for (const key in BACKGROUNDS) bgItems[key] = { name: BG_NAMES[key] || key, key: key };
    addStaticSection('Фоны заставок (240x136, увеличены в 3 раза)', bgItems, 240, 136, 3,
      (g, item) => BACKGROUNDS[item.key](g));

    // Раздел с картинками без анимации: заголовок и карточки с подписями
    function addStaticSection(titleText, items, w, h, zoom, paint) {
      const t = document.createElement('h2');
      t.textContent = titleText;
      list.appendChild(t);
      const row = document.createElement('div');
      row.className = 'row';
      list.appendChild(row);
      for (const key in items) {
        const card = document.createElement('div');
        card.className = 'card';
        const cv = document.createElement('canvas');
        cv.width = w;
        cv.height = h;
        cv.style.width = w * zoom + 'px';
        cv.style.height = h * zoom + 'px';
        cv.style.background = '#333c57';
        paint(cv.getContext('2d'), items[key]);
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = items[key].name;
        card.appendChild(cv);
        card.appendChild(label);
        row.appendChild(card);
      }
    }

    // Проигрываем все анимации по кругу, 60 шагов в секунду
    let tick = 0;
    let last = performance.now();
    function loop(now) {
      while (now - last >= 1000 / 60) {
        tick++;
        last += 1000 / 60;
      }
      for (const p of players) {
        const i = Math.floor(tick / p.anim.speed) % p.anim.frames.length;
        p.ctx.clearRect(0, 0, p.w, p.h);
        p.ctx.drawImage(p.anim.frames[i], 0, 0);
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
