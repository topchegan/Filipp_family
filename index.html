<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Запрещаем масштабирование страницы пальцами -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- Полноэкранный режим, если добавить игру на домашний экран iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Филипп">
  <title>Всем что-то надо от Филиппа</title>
  <!-- Просим браузер не хранить саму страницу в кэше, а каждый раз спрашивать свежую -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- Номер версии. Сам version.js грузим с текущим временем в адресе — он всегда свежий -->
  <script>document.write('<script src="version.js?t=' + Date.now() + '"><\/script>');</script>
  <!-- Стили с меткой версии: style.css?v=0.6 -->
  <script>loadWithVersion(['style.css']);</script>
</head>
<body>
  <!-- Игровой холст. Его размер 240x136, а увеличиваем мы его в style.css и game.js -->
  <canvas id="game" width="240" height="136"></canvas>

  <!-- Экранные кнопки для iPad. data-btn — имя кнопки, его читает game.js -->
  <div id="controls">
    <div class="btn" data-btn="left">←</div>
    <div class="btn" data-btn="right">→</div>
    <div class="btn jump" data-btn="jump">Прыжок</div>
    <!-- «Бросок» — над «Прыжком», видна только в бою с боссом -->
    <div class="btn throw" data-btn="throw">Бросок</div>
    <!-- Пауза — в правом верхнем углу, видна на уровне и в бою -->
    <div class="btn pause" data-btn="pause"></div>
  </div>

  <!-- Если в каком-то файле ошибка (например, забыта кавычка в levels.js),
       запоминаем её. Тогда game.js покажет понятную надпись, а не чёрный экран. -->
  <script>
    window.LOAD_ERRORS = [];
    window.addEventListener('error', (e) => {
      const file = (e.filename || '').split('/').pop().split('?')[0] || 'неизвестном файле';
      window.LOAD_ERRORS.push({ file: file, line: e.lineno || '?' });
    });
  </script>

  <!-- Файлы игры с меткой версии (game.js?v=0.6). Порядок важен: game.js пользуется всеми файлами выше -->
  <script>
    loadWithVersion([
      'font.js',     // пиксельный шрифт
      'sprites.js',  // картинки персонажей
      'scenes.js',   // сценарий заставок
      'levels.js',   // карты уровней
      'game.js',     // сама игра
    ]);
  </script>
</body>
</html>
