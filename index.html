<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Запрещаем масштабирование страницы пальцами -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- Полноэкранный режим, если добавить игру на домашний экран iPad -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Филипп">
  <title>Всем что-то надо от Филиппа</title>
  <!-- Приложение (PWA): манифест, иконки, цвет полосок -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1a1c2c">
  <!-- Просим браузер не хранить саму страницу в кэше, а каждый раз спрашивать свежую -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <!-- Номер версии. Сам version.js грузим с текущим временем в адресе — он всегда свежий -->
  <script>document.write('<script src="version.js?t=' + Date.now() + '"><\/script>');</script>
  <!-- Офлайн-режим: service worker с номером версии (sw.js?v=0.25). Новая версия — новый адрес,
       браузер ставит новый service worker, и он заменяет старый кэш новым.
       В Android-приложении (Capacitor) он не нужен: там все файлы и так внутри -->
  <script>
    const IN_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    if ('serviceWorker' in navigator && !IN_APP) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=' + VERSION.replace('v', ''), { scope: './' })
          .catch(() => { /* без офлайн-режима игра всё равно работает */ });
      });
    }
  </script>
  <!-- Стили с меткой версии: style.css?v=0.6 -->
  <script>loadWithVersion(['style.css', 'intro.css']);</script>
</head>
<body>
  <!-- Игровой холст. Его размер 240x136, а увеличиваем мы его в style.css и game.js -->
  <canvas id="game" width="240" height="136"></canvas>

  <!-- Экранные кнопки для iPad. data-btn — имя кнопки, его читает game.js -->
  <div id="controls">
    <div class="btn" data-btn="left">←</div>
    <div class="btn" data-btn="right">→</div>
    <div class="btn jump" data-btn="jump">Прыжок</div>
    <!-- «Бросок» — над «Прыжком», только в бою с Васей и Настей -->
    <div class="btn throw" data-btn="throw">Бросок</div>
    <!-- С уровня 2: «Ключ» — над «Прыжком», «Плов» — слева от «Прыжка». Числа ставит game.js -->
    <div class="btn wrench" data-btn="wrench">КЛЮЧ 5</div>
    <div class="btn plov" data-btn="plov">ПЛОВ 1</div>
    <!-- За рулём: «Гудок» — над «Прыжком» (а «Прыжок» становится «Тормозом») -->
    <div class="btn horn" data-btn="horn">Гудок</div>
    <!-- Пауза — в правом верхнем углу, видна на уровне и в бою -->
    <div class="btn pause" data-btn="pause"></div>
  </div>

  <!-- Если в каком-то файле ошибка (например, забыта кавычка в levels.js),
       запоминаем её. Тогда game.js покажет понятную надпись, а не чёрный экран. -->
  <script>
    window.LOAD_ERRORS = [];
    window.addEventListener('error', (e) => {
      const file = (e.filename || '').split('/').pop().split('?')[0] || 'неизвестном файле';
      window.LOAD_ERRORS.push({ file: file, line: e.lineno || '?' });
    });
  </script>

  <!-- Файлы игры с меткой версии (game.js?v=0.6). Порядок важен: game.js пользуется всеми файлами выше -->
  <script>
    loadWithVersion([
      'font.js',     // пиксельный шрифт
      'sprites.js',  // картинки персонажей
      'scenes.js',   // сценарий заставок
      'levels.js',   // карты уровней
      'game.js',     // сама игра
      'intro.js',    // заставка в стиле обложки GTA (поверх игры)
    ]);
  </script>
</body>
</html>
